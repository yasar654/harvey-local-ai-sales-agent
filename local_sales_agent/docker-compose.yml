services:
  backend:
    build: ./backend
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:8b
      HARVEY_DB_PATH: /app/data/harvey.db
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
